# A single-instance CloudNativePG Cluster — this app's own database, not a
# shared one. The operator itself lives in the homelab repo
# (infrastructure/postgres/); this Cluster CR lives here, co-located with
# the Deployment/Service that consume it, so both sides of the
# secret-naming contract stay in one repo/PR.
#
# On creation, the operator auto-generates a Secret named
# "fastapi-echo-db-app" (<cluster-name>-app) in this namespace, containing
# connection details (including a "uri" key) — deployment.yaml reads
# DATABASE_URL from it. No credentials are hand-created or committed here.
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: fastapi-echo-db
  namespace: fastapi-echo
spec:
  instances: 1
  # No HA — single-node cluster, matches this platform's stance elsewhere
  # (see homelab's D3).
  # Labels propagated to generated Pods/PVCs/Services — marks the PVC as
  # "Durable" per this platform's D4 classification scheme (loss
  # unacceptable), ahead of the "unlabelled volume alerts" enforcement
  # mechanism, which doesn't exist yet.
  inheritedMetadata:
    labels:
      platform.homelab/durability: durable
  storage:
    size: 1Gi
    storageClass: local-path-retain
  resources:
    requests: { cpu: 100m, memory: 256Mi }
    limits: { cpu: 500m, memory: 512Mi }
