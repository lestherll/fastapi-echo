apiVersion: apps/v1
kind: Deployment
metadata:
  name: fastapi-echo
  namespace: fastapi-echo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: fastapi-echo
  template:
    metadata:
      labels:
        app: fastapi-echo
    spec:
      containers:
        - name: fastapi-echo
          # :latest — no image-automation reconciler yet (unbuilt C3/D2), so
          # this is the "test server" pattern: re-pull on rollout, not
          # auto-updated on new pushes.
          image: ghcr.io/lestherll/fastapi-echo:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8000
          readinessProbe:
            httpGet: { path: /healthz, port: 8000 }
            initialDelaySeconds: 2
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /healthz, port: 8000 }
            initialDelaySeconds: 5
            periodSeconds: 20
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits: { cpu: 200m, memory: 128Mi }
